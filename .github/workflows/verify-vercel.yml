name: Verify Vercel app
on:
  push:
    branches: [main, codex/vercel-2026]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsx scripts/check-api.ts
      - run: npm run build
      - run: npm audit --omit=dev
